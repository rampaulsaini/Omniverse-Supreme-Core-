name: Omniverse Federation Intake

on:
  repository_dispatch:
    types: [omniverse_federation_job]
  workflow_dispatch:
    inputs:
      brief:
        description: 'Federation brief'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: omniverse-federation-intake-${{ github.repository }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record federation receipt
        env:
          BRIEF: ${{ github.event.client_payload.brief || inputs.brief || '' }}
          RECEIVER_RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.client_payload.source_repository }}
          MODE: ${{ github.event.client_payload.automation_mode }}
        run: python scripts/record_federation_receipt.py
      - name: Commit receipt
        run: |
          git config user.name "Omniverse Automission"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add federation/inbox
          git diff --cached --quiet || git commit -m "Record Omniverse federation intake"
          git push
