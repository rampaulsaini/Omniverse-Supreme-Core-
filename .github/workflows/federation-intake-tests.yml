name: Federation Intake Contract Tests

on:
  pull_request:
    paths:
      - ".github/workflows/omniverse-federation-intake.yml"
      - "scripts/record_federation_receipt.py"
      - "tests/test_federation_receipt.py"
      - ".github/workflows/federation-intake-tests.yml"
  push:
    branches:
      - "fix/federation-intake-receipt-contract"
    paths:
      - ".github/workflows/omniverse-federation-intake.yml"
      - "scripts/record_federation_receipt.py"
      - "tests/test_federation_receipt.py"
      - ".github/workflows/federation-intake-tests.yml"

permissions:
  contents: read

jobs:
  receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run federation receipt regression tests
        run: python -m unittest discover -s tests -p "test_federation_receipt.py" -v
