name: Revenue API Check

on:
  pull_request:
    paths:
      - "backend/revenue-api/**"
      - ".github/workflows/revenue-api-check.yml"
  push:
    branches: [main]
    paths:
      - "backend/revenue-api/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/revenue-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/revenue-api/package.json
      - name: Resolve and generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean reproducible install from generated lockfile
        run: npm ci --ignore-scripts
      - run: npm run check
      - name: Preserve generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: revenue-api-package-lock
          path: backend/revenue-api/package-lock.json
          if-no-files-found: error
          retention-days: 7
