name: Revenue API Check

on:
  pull_request:
    paths:
      - "backend/revenue-api/**"
      - ".github/workflows/revenue-api-check.yml"
  push:
    branches: [main]
    paths:
      - "backend/revenue-api/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/revenue-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/revenue-api/package.json
      - run: npm install --ignore-scripts
      - run: npm run check
